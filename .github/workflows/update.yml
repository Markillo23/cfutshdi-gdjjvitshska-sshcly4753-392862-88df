name: Actualizar ports

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_ports.py

      - name: Commit changes
        run: |
          git config user.name "auto-updater"
          git config user.email "actions@github.com"
          git add data/games.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Auto-update: nuevos ports detectados"
            git push
