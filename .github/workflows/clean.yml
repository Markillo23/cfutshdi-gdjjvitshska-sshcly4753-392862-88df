name: Limpiar ports oscuros

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run cleaner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/clean_ports.py

      - name: Commit changes
        run: |
          git config user.name "auto-cleaner"
          git config user.email "actions@github.com"
          git add data/games.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Limpieza: ports con menos de 100 estrellas eliminados"
            git push
          fi
